name: Deploy to GitHub Pages

on:
  push:
    branches: [web]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search index
        run: node scripts/build-search-index.js

      - name: Cache busting
        run: |
          CSS_HASH=$(md5sum assets/css/app.css | cut -c1-8)
          JS_HASH=$(md5sum assets/js/app.js | cut -c1-8)
          sed -i "s|assets/css/app.css|assets/css/app.css?v=${CSS_HASH}|" index.html
          sed -i "s|assets/js/app.js|assets/js/app.js?v=${JS_HASH}|" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
